name: Release Windows installer

# Собирает установщик WorkSense в облаке и прикладывает его к релизу.
# Запуск: создать тег вида v1.0.0 и запушить его (git tag v1.0.0 && git push origin v1.0.0),
# либо вручную через вкладку Actions (Run workflow).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build renderer bundle
        run: npm run build

      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkSense-Setup
          path: release/*.exe
